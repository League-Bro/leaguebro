# Builds the Windows installer and the Mac app on GitHub's servers and
# publishes them as one GitHub Release, so nobody needs Rust, Visual Studio or a Mac.
#
# To make a release: Actions tab -> "Release installers" -> Run workflow.
# The version comes from src-tauri/tauri.conf.json; bump it there (and in package.json and
# src-tauri/Cargo.toml) for each new release. Pushing a tag works too, but it must be v<that version>.
# The installer (.exe), the Mac .dmg and latest.json (for auto-updates) are attached to the release.
# The Mac job runs after the Windows one, so it adds its entries to the same latest.json.
# Requires the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repo secrets.
name: Release installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The release is named after the config version, not the tag, so a pushed
      # tag that doesn't match would rebuild (and overwrite) an older release.
      - name: Check versions match
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($conf -ne $pkg -or $conf -ne $cargo) {
            Write-Error "Versions differ: tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo. Bump all three together."
            exit 1
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$conf") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match the config version $conf. Push tag v$conf instead."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed copies trust it (see README: "Auto-updates").
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Aptabase key for the anonymous daily usage ping (see README: "Usage stats key").
          # Optional: without it the installer simply sends no stats.
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: League Bro v__VERSION__
          releaseBody: |
            **Windows:** download **League.Bro_x.y.z_x64-setup.exe** below and run it.
            If Windows shows "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed).

            **Mac:** download **League.Bro_x.y.z_universal.dmg**, open it and drag League Bro into Applications.
            The first time, macOS says it can't check the app: open **System Settings → Privacy & Security**,
            scroll down and click **Open Anyway** (the app isn't notarized by Apple).

            Set League to Borderless or Windowed so the overlay shows.
          # Publishes latest.json, which installed copies check for updates.
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false

  # Same release, built on a Mac. One universal app runs on Apple Silicon and Intel Macs.
  release-mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
        with:
          # src-tauri/tauri.macos.conf.json picks the .app/.dmg bundles and ad-hoc signing.
          args: --target universal-apple-darwin
          tagName: v__VERSION__
          releaseName: League Bro v__VERSION__
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
